<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#534ab7"/></marker></defs>
  <rect x="0" y="0" width="900" height="400" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#2c2c2a">How a sleeping buzzer still gets a fair time</text>

  <!-- time axis -->
  <line x1="60" y1="300" x2="860" y2="300" stroke="#888780" stroke-width="1.5"/>
  <text x="860" y="322" text-anchor="end" font-size="12" fill="#5f5e5a">time →</text>

  <!-- GO -->
  <line x1="120" y1="80" x2="120" y2="300" stroke="#534ab7" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="80" y="58" width="80" height="26" rx="6" fill="#eeedfe" stroke="#534ab7"/><text x="120" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#26215c">GO</text>
  <text x="120" y="320" text-anchor="middle" font-size="12" fill="#3c3489">answering opens</text>

  <!-- press -->
  <line x1="520" y1="110" x2="520" y2="300" stroke="#0f6e56" stroke-width="2.5"/>
  <rect x="470" y="88" width="100" height="26" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="520" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#04342c">button pressed</text>
  <text x="520" y="320" text-anchor="middle" font-size="12" fill="#085041">real press moment</text>

  <!-- sleeping bar -->
  <rect x="120" y="230" width="400" height="26" rx="4" fill="#f1efe8" stroke="#b4b2a9"/>
  <text x="320" y="248" text-anchor="middle" font-size="12.5" fill="#444441">buzzer asleep (≈15-50 µA): it can't hear GO</text>

  <!-- wake + send -->
  <rect x="520" y="230" width="90" height="26" rx="4" fill="#faeeda" stroke="#854f0b"/>
  <text x="565" y="248" text-anchor="middle" font-size="11.5" fill="#633806">wake ~50 ms</text>
  <rect x="610" y="230" width="70" height="26" rx="4" fill="#fde7c7" stroke="#854f0b"/>
  <text x="645" y="248" text-anchor="middle" font-size="11.5" fill="#633806">radio on</text>
  <line x1="680" y1="243" x2="740" y2="180" stroke="#534ab7" stroke-width="2" marker-end="url(#a)"/>
  <rect x="740" y="150" width="120" height="52" rx="8" fill="#eeedfe" stroke="#534ab7"/>
  <text x="800" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#26215c">Host receives</text>
  <text x="800" y="190" text-anchor="middle" font-size="11.5" fill="#3c3489">"A, pressed 92 ms ago"</text>

  <!-- ago bracket -->
  <path d="M520 214 V207 H690 V214" fill="none" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="605" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#0f6e56">"ago" ≈ 90 ms</text>

  <!-- reaction bracket -->
  <path d="M120 140 V132 H520 V140" fill="none" stroke="#534ab7" stroke-width="1.5"/>
  <text x="320" y="126" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3c3489">reaction time = (arrival − ago) − GO</text>

  <text x="450" y="352" text-anchor="middle" font-size="12.5" fill="#444441">The buzzer measures its own wake-up delay once at power-on and adds the time since waking, so the host knows when the button really went down.</text>
  <text x="450" y="372" text-anchor="middle" font-size="12.5" fill="#444441">A press made just before time-up still counts, even though it arrives ~0.1 s later. USB buzzers listen all the time and time themselves from GO directly.</text>
</svg>
