<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" rx="18" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2c2c2a">Buzzer wiring: ESP32 dev board (KBC_Node)</text>

  <!-- board -->
  <rect x="60" y="70" width="230" height="300" rx="12" fill="#1f3b63" stroke="#0c2440" stroke-width="2"/>
  <rect x="135" y="80" width="80" height="50" rx="4" fill="#9aa7b8"/>
  <text x="175" y="110" text-anchor="middle" font-size="12" fill="#1f2a37">ESP32</text>
  <rect x="155" y="350" width="40" height="22" rx="3" fill="#c0c4cc"/>
  <text x="203" y="366" font-size="11" fill="#dbe7ff">USB (power)</text>
  <circle cx="110" cy="335" r="7" fill="#3b82f6"/><text x="125" y="339" font-size="11" fill="#dbe7ff">LED GPIO 2</text>

  <!-- pins on right edge -->
  <g font-size="13" fill="#ffffff">
    <circle cx="290" cy="160" r="6" fill="#f5c542"/><text x="276" y="164" text-anchor="end">GPIO 32</text>
    <circle cx="290" cy="200" r="6" fill="#f5c542"/><text x="276" y="204" text-anchor="end">GPIO 33</text>
    <circle cx="290" cy="240" r="6" fill="#f5c542"/><text x="276" y="244" text-anchor="end">GPIO 25</text>
    <circle cx="290" cy="280" r="6" fill="#f5c542"/><text x="276" y="284" text-anchor="end">GPIO 26</text>
    <circle cx="290" cy="320" r="6" fill="#111"/><text x="276" y="324" text-anchor="end">GND</text>
  </g>

  <!-- wires + buttons -->
  <g stroke-width="3" fill="none">
    <line x1="296" y1="160" x2="440" y2="160" stroke="#e24b4a"/>
    <line x1="296" y1="200" x2="440" y2="200" stroke="#ef9f27"/>
    <line x1="296" y1="240" x2="440" y2="240" stroke="#1d9e75"/>
    <line x1="296" y1="280" x2="440" y2="280" stroke="#378add"/>
    <path d="M296 320 H640 V160" stroke="#2c2c2a"/>
    <line x1="520" y1="160" x2="640" y2="160" stroke="#2c2c2a"/>
    <line x1="520" y1="200" x2="640" y2="200" stroke="#2c2c2a"/>
    <line x1="520" y1="240" x2="640" y2="240" stroke="#2c2c2a"/>
    <line x1="520" y1="280" x2="640" y2="280" stroke="#2c2c2a"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="440" y="145" width="80" height="30" rx="6" fill="#fcebeb" stroke="#a32d2d"/><text x="480" y="165" fill="#791f1f">A</text>
    <rect x="440" y="185" width="80" height="30" rx="6" fill="#faeeda" stroke="#854f0b"/><text x="480" y="205" fill="#633806">B</text>
    <rect x="440" y="225" width="80" height="30" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="480" y="245" fill="#085041">C</text>
    <rect x="440" y="265" width="80" height="30" rx="6" fill="#e6f1fb" stroke="#185fa5"/><text x="480" y="285" fill="#0c447c">D</text>
  </g>
  <text x="655" y="244" font-size="13" fill="#2c2c2a">to GND</text>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#5f5e5a">Each button: one leg to its GPIO, other leg to GND. No resistors (internal pull-ups).</text>
</svg>
