<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6894"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="380" rx="18" fill="#ffffff"/>

  <rect x="30" y="130" width="190" height="120" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="125" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#26215c">Laptop / projector</text>
  <text x="125" y="196" text-anchor="middle" font-size="13" fill="#3c3489">Web app in any browser</text>
  <text x="125" y="218" text-anchor="middle" font-size="13" fill="#3c3489">http://kbc.local</text>

  <rect x="330" y="115" width="220" height="150" rx="12" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
  <text x="440" y="155" text-anchor="middle" font-size="17" font-weight="600" fill="#412402">Host ESP32</text>
  <text x="440" y="181" text-anchor="middle" font-size="13" fill="#633806">Runs the game + website</text>
  <text x="440" y="203" text-anchor="middle" font-size="13" fill="#633806">Own Wi-Fi "KBC-Quiz"</text>
  <text x="440" y="225" text-anchor="middle" font-size="13" fill="#633806">+ optional school Wi-Fi</text>
  <text x="440" y="247" text-anchor="middle" font-size="12" fill="#854f0b">firmware: KBC_Host · USB power</text>

  <rect x="650" y="30" width="225" height="140" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="2"/>
  <rect x="670" y="20" width="110" height="22" rx="11" fill="#0f6e56"/>
  <text x="725" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RECOMMENDED</text>
  <text x="762" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#04342c">Battery buzzer</text>
  <text x="762" y="94" text-anchor="middle" font-size="13" fill="#085041">ESP32-C3 SuperMini</text>
  <text x="762" y="116" text-anchor="middle" font-size="13" fill="#085041">2-3 x AA · sleeps until pressed</text>
  <text x="762" y="138" text-anchor="middle" font-size="13" fill="#085041">~1-2 years per set of cells</text>
  <text x="762" y="158" text-anchor="middle" font-size="12" fill="#0f6e56">firmware: KBC_BatteryC3</text>

  <rect x="650" y="210" width="225" height="120" rx="12" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
  <text x="762" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2c2a">USB buzzer</text>
  <text x="762" y="270" text-anchor="middle" font-size="13" fill="#444441">ESP32 dev board</text>
  <text x="762" y="292" text-anchor="middle" font-size="13" fill="#444441">always listening · USB power</text>
  <text x="762" y="314" text-anchor="middle" font-size="12" fill="#5f5e5a">firmware: KBC_Node</text>

  <line x1="222" y1="190" x2="326" y2="190" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="274" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">Wi-Fi</text>
  <path d="M552 170 C605 170 605 100 646 100" fill="none" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M552 210 C605 210 605 270 646 270" fill="none" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="600" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">ESP-NOW</text>

  <text x="450" y="362" text-anchor="middle" font-size="13" fill="#5f5e5a">ESP-NOW = direct ESP-to-ESP radio: no router needed, ~3 ms replies. Up to 40 buzzers per host, both kinds can be mixed.</text>
</svg>
