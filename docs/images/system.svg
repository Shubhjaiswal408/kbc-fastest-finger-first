<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6894"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="18" fill="#ffffff"/>

  <!-- laptop / projector -->
  <rect x="30" y="120" width="190" height="120" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="125" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#26215c">Laptop / projector</text>
  <text x="125" y="186" text-anchor="middle" font-size="13" fill="#3c3489">Web app in any browser</text>
  <text x="125" y="208" text-anchor="middle" font-size="13" fill="#3c3489">http://kbc.local</text>

  <!-- host -->
  <rect x="330" y="105" width="220" height="150" rx="12" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
  <text x="440" y="145" text-anchor="middle" font-size="17" font-weight="600" fill="#412402">Host ESP32</text>
  <text x="440" y="171" text-anchor="middle" font-size="13" fill="#633806">Runs the game + website</text>
  <text x="440" y="193" text-anchor="middle" font-size="13" fill="#633806">Own Wi-Fi "KBC-Quiz"</text>
  <text x="440" y="215" text-anchor="middle" font-size="13" fill="#633806">+ optional school Wi-Fi</text>
  <text x="440" y="237" text-anchor="middle" font-size="12" fill="#854f0b">firmware: KBC_Host</text>

  <!-- buzzers -->
  <rect x="660" y="40" width="210" height="120" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="765" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#04342c">Buzzer (USB power)</text>
  <text x="765" y="102" text-anchor="middle" font-size="13" fill="#085041">ESP32 dev board</text>
  <text x="765" y="124" text-anchor="middle" font-size="13" fill="#085041">Always listening</text>
  <text x="765" y="146" text-anchor="middle" font-size="12" fill="#0f6e56">firmware: KBC_Node</text>

  <rect x="660" y="200" width="210" height="120" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="765" y="238" text-anchor="middle" font-size="16" font-weight="600" fill="#04342c">Buzzer (battery)</text>
  <text x="765" y="262" text-anchor="middle" font-size="13" fill="#085041">XIAO ESP32-C6 + 2 x AA</text>
  <text x="765" y="284" text-anchor="middle" font-size="13" fill="#085041">Sleeps until pressed</text>
  <text x="765" y="306" text-anchor="middle" font-size="12" fill="#0f6e56">firmware: KBC_BatteryC6</text>

  <!-- links -->
  <line x1="222" y1="180" x2="326" y2="180" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="274" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">Wi-Fi</text>

  <path d="M552 160 C610 160 610 100 656 100" fill="none" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M552 200 C610 200 610 260 656 260" fill="none" stroke="#6b6894" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="606" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">ESP-NOW</text>

  <text x="450" y="340" text-anchor="middle" font-size="13" fill="#5f5e5a">ESP-NOW is direct ESP-to-ESP radio: no router, ~1-3 ms. Up to 40 buzzers, mix both kinds freely.</text>
</svg>
