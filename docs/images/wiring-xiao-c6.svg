<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" rx="18" fill="#ffffff"/>
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2c2c2a">Battery buzzer wiring: Seeed XIAO ESP32-C6 (KBC_BatteryC6)</text>

  <!-- board -->
  <rect x="80" y="80" width="200" height="260" rx="14" fill="#1b1b1f" stroke="#000" stroke-width="2"/>
  <rect x="145" y="70" width="70" height="26" rx="4" fill="#c0c4cc"/><text x="180" y="62" text-anchor="middle" font-size="12" fill="#5f5e5a">USB-C (upload only)</text>
  <rect x="130" y="150" width="100" height="70" rx="6" fill="#3a3a44"/><text x="180" y="190" text-anchor="middle" font-size="13" fill="#e5e5ea">XIAO C6</text>
  <circle cx="115" cy="300" r="7" fill="#f5c542"/><text x="130" y="304" font-size="11" fill="#e5e5ea">user LED</text>

  <!-- left pins: power -->
  <g font-size="13" fill="#ffffff">
    <circle cx="80" cy="120" r="6" fill="#e24b4a"/><text x="94" y="124">3V3</text>
    <circle cx="80" cy="160" r="6" fill="#111" stroke="#888"/><text x="94" y="164">GND</text>
  </g>
  <!-- right pins: buttons -->
  <g font-size="13" fill="#ffffff">
    <circle cx="280" cy="120" r="6" fill="#f5c542"/><text x="266" y="124" text-anchor="end">D0</text>
    <circle cx="280" cy="160" r="6" fill="#f5c542"/><text x="266" y="164" text-anchor="end">D1</text>
    <circle cx="280" cy="200" r="6" fill="#f5c542"/><text x="266" y="204" text-anchor="end">D2</text>
    <circle cx="280" cy="260" r="6" fill="#f5c542" stroke="#fff" stroke-dasharray="2 2"/><text x="266" y="264" text-anchor="end">MTDO*</text>
  </g>

  <!-- buttons -->
  <g stroke-width="3" fill="none">
    <line x1="286" y1="120" x2="430" y2="120" stroke="#e24b4a"/>
    <line x1="286" y1="160" x2="430" y2="160" stroke="#ef9f27"/>
    <line x1="286" y1="200" x2="430" y2="200" stroke="#1d9e75"/>
    <line x1="286" y1="260" x2="430" y2="260" stroke="#378add" stroke-dasharray="6 4"/>
    <line x1="510" y1="120" x2="560" y2="120" stroke="#2c2c2a"/>
    <line x1="510" y1="160" x2="560" y2="160" stroke="#2c2c2a"/>
    <line x1="510" y1="200" x2="560" y2="200" stroke="#2c2c2a"/>
    <line x1="510" y1="260" x2="560" y2="260" stroke="#2c2c2a"/>
    <path d="M560 112 V380 H52 V160 H74" stroke="#2c2c2a"/>
    <path d="M695 304 V380 H560" stroke="#2c2c2a"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="430" y="105" width="80" height="30" rx="6" fill="#fcebeb" stroke="#a32d2d"/><text x="470" y="125" fill="#791f1f">A</text>
    <rect x="430" y="145" width="80" height="30" rx="6" fill="#faeeda" stroke="#854f0b"/><text x="470" y="165" fill="#633806">B</text>
    <rect x="430" y="185" width="80" height="30" rx="6" fill="#e1f5ee" stroke="#0f6e56"/><text x="470" y="205" fill="#085041">C</text>
    <rect x="430" y="245" width="80" height="30" rx="6" fill="#e6f1fb" stroke="#185fa5"/><text x="470" y="265" fill="#0c447c">D</text>
  </g>
  <text x="300" y="398" text-anchor="middle" font-size="12" fill="#5f5e5a">GND (shared by all buttons and the battery)</text>

  <!-- battery -->
  <g>
    <rect x="610" y="90" width="170" height="120" rx="10" fill="#f1efe8" stroke="#5f5e5a"/>
    <text x="695" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">2 x AA</text>
    <rect x="630" y="135" width="130" height="26" rx="13" fill="#e8e6dd" stroke="#888780"/>
    <rect x="630" y="168" width="130" height="26" rx="13" fill="#e8e6dd" stroke="#888780"/>
    <text x="695" y="153" text-anchor="middle" font-size="12" fill="#444441">1.5 V</text>
    <text x="695" y="186" text-anchor="middle" font-size="12" fill="#444441">1.5 V</text>

    <rect x="610" y="240" width="170" height="64" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-dasharray="5 4"/>
    <text x="695" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#26215c">Buck-boost 3.3 V</text>
    <text x="695" y="288" text-anchor="middle" font-size="12" fill="#3c3489">recommended (TPS63900)</text>
    <path d="M695 210 V238" stroke="#e24b4a" stroke-width="3"/>
    <path d="M610 272 H596 V340 H30 V120 H74" fill="none" stroke="#e24b4a" stroke-width="3"/>
    <text x="330" y="356" font-size="12" fill="#a32d2d">+3.3 V to the 3V3 pin</text>
  </g>

  <text x="410" y="430" text-anchor="middle" font-size="12.5" fill="#5f5e5a">*MTDO = GPIO 7, a small pad on the back. Only GPIO 0-7 can wake the C6; D3-D10 cannot.</text>
  <text x="410" y="448" text-anchor="middle" font-size="12.5" fill="#a32d2d">Never connect USB and the batteries at the same time.</text>
</svg>
