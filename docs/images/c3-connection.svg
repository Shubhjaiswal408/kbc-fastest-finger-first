<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f2ee"/></linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#273049"/><stop offset="1" stop-color="#161b2b"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfe3ea"/><stop offset="1" stop-color="#9aa3b2"/></linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecf1"/><stop offset="1" stop-color="#a7adb8"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f2937"/><stop offset=".5" stop-color="#4b5563"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".5" stop-color="#3b5bcc"/><stop offset="1" stop-color="#172e6e"/></linearGradient>
    <linearGradient id="res" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8bf8f"/><stop offset=".5" stop-color="#f1dfb8"/><stop offset="1" stop-color="#c7a971"/></linearGradient>
    <radialGradient id="btnA" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff8fb8"/><stop offset="1" stop-color="#c2255c"/></radialGradient>
    <radialGradient id="btnB" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#d97706"/></radialGradient>
    <radialGradient id="btnC" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#7ee0b3"/><stop offset="1" stop-color="#0f8a5f"/></radialGradient>
    <radialGradient id="btnD" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8cc2ff"/><stop offset="1" stop-color="#1e64c8"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f5e5a"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="860" rx="22" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f1d2b">KBC battery buzzer: connection diagram</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#5f5e5a">ESP32-C3 SuperMini · 4 buttons · 2 × AA · firmware KBC_BatteryC3</text>

  <!-- ===================== WIRES (drawn first, under the parts) ===================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- GND: pin -> left -> down -> bus -->
    <path d="M410 284 V330 H200 V760 H1120 V708" stroke="#111" stroke-width="8"/>
    <path d="M410 284 V330 H200 V760 H1120 V708" stroke="#3a3a3a" stroke-width="5"/>
    <!-- 3V3: pin -> bus (with hops over the 4 button wires) -> switch -> battery + -->
    <path d="M470 284 V360 H522 a8 8 0 0 1 16 0 H582 a8 8 0 0 1 16 0 H702 a8 8 0 0 1 16 0 H762 a8 8 0 0 1 16 0 H1120 V410" stroke="#8f1d1d" stroke-width="8"/>
    <path d="M470 284 V360 H522 a8 8 0 0 1 16 0 H582 a8 8 0 0 1 16 0 H702 a8 8 0 0 1 16 0 H762 a8 8 0 0 1 16 0 H1120 V410" stroke="#e03131" stroke-width="5"/>

    <!-- button signal wires: pin -> junction -> button top -->
    <path d="M530 284 V470 H320 V522" stroke="#123f80" stroke-width="8"/><path d="M530 284 V470 H320 V522" stroke="#2f7fe0" stroke-width="5"/>
    <path d="M590 284 V490 H520 V522" stroke="#0b5c3f" stroke-width="8"/><path d="M590 284 V490 H520 V522" stroke="#14a06f" stroke-width="5"/>
    <path d="M710 284 V490 H760 V522" stroke="#8a4b05" stroke-width="8"/><path d="M710 284 V490 H760 V522" stroke="#f08c00" stroke-width="5"/>
    <path d="M770 284 V470 H960 V522" stroke="#7a1238" stroke-width="8"/><path d="M770 284 V470 H960 V522" stroke="#d6336c" stroke-width="5"/>

    <!-- pull-up legs: 3V3 bus -> resistor -> junction on the signal wire -->
    <g stroke="#9a9a9a" stroke-width="3">
      <path d="M560 360 V376 M560 428 V440 H530"/>
      <path d="M620 360 V376 M620 428 V440 H590"/>
      <path d="M740 360 V376 M740 428 V440 H710"/>
      <path d="M800 360 V376 M800 428 V440 H770"/>
    </g>
    <!-- buttons bottom -> GND bus -->
    <g stroke="#111" stroke-width="8"><path d="M320 598 V760 M520 598 V760 M760 598 V760 M960 598 V760"/></g>
    <g stroke="#3a3a3a" stroke-width="5"><path d="M320 598 V760 M520 598 V760 M760 598 V760 M960 598 V760"/></g>
    <!-- capacitor legs -->
    <path d="M1040 360 V508" stroke="#9a9a9a" stroke-width="3"/>
    <path d="M1040 580 V760" stroke="#9a9a9a" stroke-width="3"/>
  </g>
  <!-- junction dots -->
  <g fill="#1f1d2b">
    <circle cx="530" cy="440" r="5.5"/><circle cx="590" cy="440" r="5.5"/><circle cx="710" cy="440" r="5.5"/><circle cx="770" cy="440" r="5.5"/>
    <circle cx="560" cy="360" r="5.5"/><circle cx="620" cy="360" r="5.5"/><circle cx="740" cy="360" r="5.5"/><circle cx="800" cy="360" r="5.5"/><circle cx="1040" cy="360" r="5.5"/>
    <circle cx="320" cy="760" r="5.5"/><circle cx="520" cy="760" r="5.5"/><circle cx="760" cy="760" r="5.5"/><circle cx="960" cy="760" r="5.5"/><circle cx="1040" cy="760" r="5.5"/>
  </g>

  <!-- ===================== BOARD ===================== -->
  <g filter="url(#sh)">
    <rect x="300" y="110" width="530" height="174" rx="16" fill="url(#pcb)" stroke="#0d1120" stroke-width="2"/>
  </g>
  <!-- USB-C -->
  <rect x="266" y="168" width="48" height="58" rx="10" fill="url(#usb)" stroke="#6b7280"/>
  <rect x="276" y="186" width="26" height="22" rx="6" fill="#4b5563"/>
  <text x="290" y="158" text-anchor="middle" font-size="12" fill="#5f5e5a">USB-C</text>
  <!-- chip -->
  <rect x="505" y="150" width="96" height="96" rx="8" fill="url(#chip)" stroke="#6b7280"/>
  <text x="553" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ESP32-C3</text>
  <text x="553" y="212" text-anchor="middle" font-size="10" fill="#374151">SuperMini</text>
  <!-- buttons on board -->
  <rect x="345" y="140" width="40" height="22" rx="5" fill="#d1d5db"/><circle cx="365" cy="151" r="6" fill="#111"/><text x="365" y="176" text-anchor="middle" font-size="10" fill="#c9cfdc">BOOT</text>
  <rect x="345" y="210" width="40" height="22" rx="5" fill="#d1d5db"/><circle cx="365" cy="221" r="6" fill="#111"/><text x="365" y="246" text-anchor="middle" font-size="10" fill="#c9cfdc">RST</text>
  <!-- LEDs -->
  <rect x="425" y="150" width="14" height="9" rx="2" fill="#ff4d4d"/>
  <path d="M419 144 L445 165 M445 144 L419 165" stroke="#ffd43b" stroke-width="3" stroke-linecap="round"/>
  <rect x="425" y="214" width="14" height="9" rx="2" fill="#4dabf7"/>
  <text x="432" y="244" text-anchor="middle" font-size="10" fill="#a5d8ff">status LED</text>
  <!-- antenna -->
  <rect x="690" y="140" width="110" height="114" rx="8" fill="none" stroke="#ffd43b" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M708 197 l10 -16 l10 32 l10 -32 l10 32 l10 -32 l10 32 l10 -16" fill="none" stroke="#c8a94a" stroke-width="3" stroke-linejoin="round"/>
  <text x="745" y="236" text-anchor="middle" font-size="11" fill="#ffe08a">antenna</text>

  <!-- top pins (unused) -->
  <g font-size="11" fill="#8f97ad" text-anchor="middle">
    <g fill="#b78a2a"><circle cx="350" cy="110" r="8"/><circle cx="410" cy="110" r="8"/><circle cx="470" cy="110" r="8"/><circle cx="530" cy="110" r="8"/><circle cx="590" cy="110" r="8"/><circle cx="650" cy="110" r="8"/><circle cx="710" cy="110" r="8"/><circle cx="770" cy="110" r="8"/></g>
    <g fill="#141826"><circle cx="350" cy="110" r="3.5"/><circle cx="410" cy="110" r="3.5"/><circle cx="470" cy="110" r="3.5"/><circle cx="530" cy="110" r="3.5"/><circle cx="590" cy="110" r="3.5"/><circle cx="650" cy="110" r="3.5"/><circle cx="710" cy="110" r="3.5"/><circle cx="770" cy="110" r="3.5"/></g>
    <text x="350" y="134">21</text><text x="410" y="134">20</text><text x="470" y="134">10</text><text x="530" y="134">9</text><text x="590" y="134">8</text><text x="650" y="134">7</text><text x="710" y="134">6</text><text x="770" y="134">5</text>
  </g>
  <!-- bottom pins (used) -->
  <g fill="#d4a63a"><circle cx="350" cy="284" r="9"/><circle cx="410" cy="284" r="9"/><circle cx="470" cy="284" r="9"/><circle cx="530" cy="284" r="9"/><circle cx="590" cy="284" r="9"/><circle cx="650" cy="284" r="9"/><circle cx="710" cy="284" r="9"/><circle cx="770" cy="284" r="9"/></g>
  <g fill="#141826"><circle cx="350" cy="284" r="4"/><circle cx="410" cy="284" r="4"/><circle cx="470" cy="284" r="4"/><circle cx="530" cy="284" r="4"/><circle cx="590" cy="284" r="4"/><circle cx="650" cy="284" r="4"/><circle cx="710" cy="284" r="4"/><circle cx="770" cy="284" r="4"/></g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="350" y="266" fill="#8f97ad">5V</text>
    <text x="410" y="266" fill="#e6e8f0">GND</text>
    <text x="470" y="266" fill="#ff8787">3V3</text>
    <text x="530" y="266" fill="#74c0fc">4</text>
    <text x="590" y="266" fill="#63e6be">3</text>
    <text x="650" y="266" fill="#8f97ad">2</text>
    <text x="710" y="266" fill="#ffc078">1</text>
    <text x="770" y="266" fill="#faa2c1">0</text>
  </g>

  <!-- ===================== RESISTORS (100 kΩ: brown black yellow gold) ===================== -->
  <g>
    <g transform="translate(560 402)">
      <rect x="-9" y="-26" width="18" height="52" rx="9" fill="url(#res)" stroke="#9c7c45"/>
      <rect x="-9" y="-17" width="18" height="5" fill="#7a4a1c"/><rect x="-9" y="-7" width="18" height="5" fill="#111"/><rect x="-9" y="3" width="18" height="5" fill="#f5c400"/><rect x="-9" y="14" width="18" height="4" fill="#c9a227"/>
    </g>
    <g transform="translate(620 402)">
      <rect x="-9" y="-26" width="18" height="52" rx="9" fill="url(#res)" stroke="#9c7c45"/>
      <rect x="-9" y="-17" width="18" height="5" fill="#7a4a1c"/><rect x="-9" y="-7" width="18" height="5" fill="#111"/><rect x="-9" y="3" width="18" height="5" fill="#f5c400"/><rect x="-9" y="14" width="18" height="4" fill="#c9a227"/>
    </g>
    <g transform="translate(740 402)">
      <rect x="-9" y="-26" width="18" height="52" rx="9" fill="url(#res)" stroke="#9c7c45"/>
      <rect x="-9" y="-17" width="18" height="5" fill="#7a4a1c"/><rect x="-9" y="-7" width="18" height="5" fill="#111"/><rect x="-9" y="3" width="18" height="5" fill="#f5c400"/><rect x="-9" y="14" width="18" height="4" fill="#c9a227"/>
    </g>
    <g transform="translate(800 402)">
      <rect x="-9" y="-26" width="18" height="52" rx="9" fill="url(#res)" stroke="#9c7c45"/>
      <rect x="-9" y="-17" width="18" height="5" fill="#7a4a1c"/><rect x="-9" y="-7" width="18" height="5" fill="#111"/><rect x="-9" y="3" width="18" height="5" fill="#f5c400"/><rect x="-9" y="14" width="18" height="4" fill="#c9a227"/>
    </g>
  </g>

  <!-- ===================== BUTTONS ===================== -->
  <g font-weight="800" text-anchor="middle" font-size="30" fill="#ffffff">
    <g filter="url(#sh)"><circle cx="320" cy="560" r="40" fill="#2b2b33"/><circle cx="320" cy="560" r="31" fill="url(#btnD)"/></g><text x="320" y="571">D</text>
    <g filter="url(#sh)"><circle cx="520" cy="560" r="40" fill="#2b2b33"/><circle cx="520" cy="560" r="31" fill="url(#btnC)"/></g><text x="520" y="571">C</text>
    <g filter="url(#sh)"><circle cx="760" cy="560" r="40" fill="#2b2b33"/><circle cx="760" cy="560" r="31" fill="url(#btnB)"/></g><text x="760" y="571">B</text>
    <g filter="url(#sh)"><circle cx="960" cy="560" r="40" fill="#2b2b33"/><circle cx="960" cy="560" r="31" fill="url(#btnA)"/></g><text x="960" y="571">A</text>
  </g>

  <!-- ===================== CAPACITOR 470 µF ===================== -->
  <g filter="url(#sh)">
    <rect x="1020" y="506" width="40" height="76" rx="8" fill="url(#cap)" stroke="#0f1f55"/>
    <ellipse cx="1040" cy="508" rx="20" ry="6" fill="#9aa8c9"/>
    <rect x="1050" y="514" width="6" height="64" fill="#d0d8ea" opacity=".85"/>
  </g>
  <text x="1040" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1d2b">470 µF</text>
  <text x="1040" y="626" text-anchor="middle" font-size="11" fill="#5f5e5a">stripe (−) to GND</text>

  <!-- ===================== BATTERY 2 x AA ===================== -->
  <g filter="url(#sh)">
    <rect x="1086" y="410" width="68" height="300" rx="10" fill="#2a2a2a"/>
    <rect x="1094" y="420" width="52" height="134" rx="7" fill="url(#cell)"/><rect x="1110" y="414" width="20" height="8" rx="2" fill="#c0c4cc"/>
    <rect x="1094" y="566" width="52" height="134" rx="7" fill="url(#cell)"/>
    <text x="1120" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#f5c542">AA</text>
    <text x="1120" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#f5c542">AA</text>
  </g>
  <text x="1104" y="404" text-anchor="end" font-size="15" font-weight="800" fill="#e03131">+</text>
  <text x="1104" y="728" text-anchor="end" font-size="18" font-weight="800" fill="#1f1d2b">−</text>
  <!-- power switch -->
  <rect x="1102" y="372" width="36" height="20" rx="5" fill="#495057"/><rect x="1106" y="375" width="14" height="14" rx="3" fill="#f8f9fa"/>
  <text x="1150" y="386" font-size="11" fill="#5f5e5a">switch</text>

  <!-- ===================== CALLOUTS ===================== -->
  <g font-size="13">
    <path d="M250 96 H432 V136" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#ar)"/>
    <text x="60" y="92" font-weight="700" fill="#c92a2a">Remove this red LED</text>
    <text x="60" y="110" fill="#5f5e5a">(always on, drains AA in weeks)</text>
    <text x="852" y="200" fill="#8a6d1d">◀ keep the antenna end free:</text>
    <text x="862" y="218" fill="#8a6d1d">no metal or battery near it</text>
    <text x="828" y="408" font-size="12.5" font-weight="700" fill="#1f1d2b">4 × 100 kΩ pull-ups</text>
    <text x="828" y="424" font-size="11.5" fill="#5f5e5a">brown · black · yellow</text>
    <text x="214" y="352" font-size="12" font-weight="700" fill="#3a3a3a">GND</text>
    <text x="640" y="352" font-size="12" font-weight="700" fill="#c92a2a">3.3 V</text>
    <text x="36" y="664" font-size="12.5" fill="#5f5e5a">Each button:</text>
    <text x="36" y="680" font-size="12.5" fill="#5f5e5a">one leg → its pin</text>
    <text x="36" y="696" font-size="12.5" fill="#5f5e5a">other leg → GND</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="786" width="1120" height="56" rx="12" fill="#ffffff" stroke="#d3d1c7"/>
  <g font-size="13" fill="#2c2c2a">
    <line x1="64" y1="814" x2="96" y2="814" stroke="#e03131" stroke-width="5" stroke-linecap="round"/><text x="104" y="818">3.3 V</text>
    <line x1="168" y1="814" x2="200" y2="814" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/><text x="208" y="818">GND</text>
    <line x1="268" y1="814" x2="300" y2="814" stroke="#d6336c" stroke-width="5" stroke-linecap="round"/><text x="308" y="818">A · GPIO 0</text>
    <line x1="400" y1="814" x2="432" y2="814" stroke="#f08c00" stroke-width="5" stroke-linecap="round"/><text x="440" y="818">B · GPIO 1</text>
    <line x1="532" y1="814" x2="564" y2="814" stroke="#14a06f" stroke-width="5" stroke-linecap="round"/><text x="572" y="818">C · GPIO 3</text>
    <line x1="664" y1="814" x2="696" y2="814" stroke="#2f7fe0" stroke-width="5" stroke-linecap="round"/><text x="704" y="818">D · GPIO 4</text>
    <text x="800" y="811" font-size="12" fill="#5f5e5a">Wires hop (⌒) where they cross without connecting · ● = joined</text>
    <text x="800" y="829" font-size="12" font-weight="700" fill="#c92a2a">Never connect batteries to 5V · never USB + batteries together</text>
  </g>
</svg>
