<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#2c2c2a">KBC battery buzzer: ESP32-C3 SuperMini wiring</text>

  <!-- power section -->
  <text x="40" y="74" font-size="14" font-weight="600" fill="#2c2c2a">Power: pick one</text>
  <rect x="40" y="86" width="380" height="96" rx="10" fill="#f1efe8" stroke="#888780"/>
  <text x="56" y="110" font-size="13" font-weight="600" fill="#2c2c2a">A. 2 x AA, direct (simplest)</text>
  <text x="56" y="132" font-size="12.5" fill="#444441">BAT+ → switch → 3V3 pin · BAT− → GND</text>
  <text x="56" y="152" font-size="12.5" fill="#444441">Life ≈ 8-12 months (C3 stops at ~2.8 V)</text>
  <text x="56" y="172" font-size="12.5" fill="#444441">Nothing to buy</text>

  <rect x="40" y="194" width="380" height="118" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.6"/>
  <text x="56" y="218" font-size="13" font-weight="600" fill="#04342c">B. 3 x AA + HT7833 (best, ≈ 2 years)</text>
  <!-- mini schematic -->
  <rect x="70" y="232" width="56" height="22" rx="4" fill="#ffffff" stroke="#0f6e56"/><text x="98" y="248" text-anchor="middle" font-size="11" fill="#085041">3 x AA</text>
  <line x1="126" y1="243" x2="176" y2="243" stroke="#e24b4a" stroke-width="2"/>
  <rect x="176" y="230" width="80" height="28" rx="4" fill="#ffffff" stroke="#0f6e56"/><text x="216" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#085041">HT7833</text>
  <line x1="256" y1="243" x2="330" y2="243" stroke="#e24b4a" stroke-width="2"/>
  <text x="336" y="247" font-size="11.5" fill="#a32d2d">3V3 pin</text>
  <text x="140" y="238" font-size="10" fill="#085041">VIN</text><text x="262" y="238" font-size="10" fill="#085041">VOUT</text>
  <text x="56" y="280" font-size="12" fill="#085041">10 µF on VIN · 470 µF + 100 nF on VOUT · GND common</text>
  <text x="56" y="300" font-size="12" fill="#085041">HT7333 or MCP1700-3302 also work (idle ≈ 2-4 µA)</text>

  <rect x="40" y="324" width="380" height="96" rx="10" fill="#fcebeb" stroke="#a32d2d"/>
  <text x="56" y="348" font-size="13" font-weight="600" fill="#791f1f">Don't</text>
  <text x="56" y="370" font-size="12.5" fill="#791f1f">✗ batteries on the 5V pin   ✗ USB + batteries together</text>
  <text x="56" y="390" font-size="12.5" fill="#791f1f">✗ AMS1117 / LM7833 / MT3608 / XL6009 (waste 1-5 mA)</text>
  <text x="56" y="410" font-size="12.5" fill="#791f1f">✗ keep the red power LED (drains AA in weeks)</text>

  <!-- module -->
  <rect x="470" y="80" width="150" height="320" rx="12" fill="#1d1d26"/>
  <text x="545" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#ececf3">C3</text>
  <text x="545" y="248" text-anchor="middle" font-size="11" fill="#c9c9d6">SuperMini</text>
  <g font-size="12" fill="#ffffff">
    <text x="610" y="124" text-anchor="end">3V3</text><circle cx="620" cy="120" r="5" fill="#e24b4a"/>
    <text x="610" y="164" text-anchor="end">GND</text><circle cx="620" cy="160" r="5" fill="#111" stroke="#999"/>
    <text x="610" y="214" text-anchor="end">GPIO0</text><circle cx="620" cy="210" r="5" fill="#f5c542"/>
    <text x="610" y="264" text-anchor="end">GPIO1</text><circle cx="620" cy="260" r="5" fill="#f5c542"/>
    <text x="610" y="314" text-anchor="end">GPIO3</text><circle cx="620" cy="310" r="5" fill="#f5c542"/>
    <text x="610" y="364" text-anchor="end">GPIO4</text><circle cx="620" cy="360" r="5" fill="#f5c542"/>
  </g>

  <!-- rails -->
  <line x1="625" y1="120" x2="870" y2="120" stroke="#e24b4a" stroke-width="2.5"/>
  <text x="866" y="112" text-anchor="end" font-size="12" font-weight="600" fill="#a32d2d">3V3</text>
  <path d="M625 160 H690 V440 H860" fill="none" stroke="#2c2c2a" stroke-width="2.5"/>
  <text x="866" y="452" text-anchor="end" font-size="12" font-weight="600" fill="#2c2c2a">GND</text>
  <!-- C2 -->
  <line x1="660" y1="120" x2="660" y2="138" stroke="#2c2c2a" stroke-width="1.5"/>
  <line x1="650" y1="138" x2="670" y2="138" stroke="#2c2c2a" stroke-width="2"/><line x1="650" y1="144" x2="670" y2="144" stroke="#2c2c2a" stroke-width="2"/>
  <line x1="660" y1="144" x2="660" y2="160" stroke="#2c2c2a" stroke-width="1.5"/>
  <text x="660" y="111" text-anchor="middle" font-size="10.5" fill="#444441">470 µF</text>

  <!-- button rows -->
  <g font-size="12">
    <g>
      <line x1="625" y1="210" x2="760" y2="210" stroke="#e24b4a" stroke-width="2"/>
      <rect x="742" y="120" width="0" height="0"/>
      <line x1="760" y1="120" x2="760" y2="160" stroke="#888780" stroke-width="1.5"/><rect x="752" y="160" width="16" height="30" rx="2" fill="#fff" stroke="#888780"/><line x1="760" y1="190" x2="760" y2="210" stroke="#888780" stroke-width="1.5"/>
      <text x="774" y="180" fill="#444441">100k</text>
      <rect x="800" y="198" width="44" height="24" rx="5" fill="#fcebeb" stroke="#a32d2d"/><text x="822" y="215" text-anchor="middle" font-weight="700" fill="#791f1f">A</text>
      <line x1="760" y1="210" x2="800" y2="210" stroke="#e24b4a" stroke-width="2"/>
      <path d="M844 210 H860 V440" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
    </g>
    <g>
      <line x1="625" y1="260" x2="800" y2="260" stroke="#ef9f27" stroke-width="2"/>
      <line x1="740" y1="120" x2="740" y2="215" stroke="#888780" stroke-width="1.5"/><rect x="732" y="215" width="16" height="28" rx="2" fill="#fff" stroke="#888780"/><line x1="740" y1="243" x2="740" y2="260" stroke="#888780" stroke-width="1.5"/>
      <rect x="800" y="248" width="44" height="24" rx="5" fill="#faeeda" stroke="#854f0b"/><text x="822" y="265" text-anchor="middle" font-weight="700" fill="#633806">B</text>
      <path d="M844 260 H860" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
    </g>
    <g>
      <line x1="625" y1="310" x2="800" y2="310" stroke="#1d9e75" stroke-width="2"/>
      <line x1="720" y1="120" x2="720" y2="265" stroke="#888780" stroke-width="1.5"/><rect x="712" y="265" width="16" height="28" rx="2" fill="#fff" stroke="#888780"/><line x1="720" y1="293" x2="720" y2="310" stroke="#888780" stroke-width="1.5"/>
      <rect x="800" y="298" width="44" height="24" rx="5" fill="#e1f5ee" stroke="#0f6e56"/><text x="822" y="315" text-anchor="middle" font-weight="700" fill="#085041">C</text>
      <path d="M844 310 H860" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
    </g>
    <g>
      <line x1="625" y1="360" x2="800" y2="360" stroke="#378add" stroke-width="2"/>
      <line x1="705" y1="120" x2="705" y2="315" stroke="#888780" stroke-width="1.5"/><rect x="697" y="315" width="16" height="28" rx="2" fill="#fff" stroke="#888780"/><line x1="705" y1="343" x2="705" y2="360" stroke="#888780" stroke-width="1.5"/>
      <rect x="800" y="348" width="44" height="24" rx="5" fill="#e6f1fb" stroke="#185fa5"/><text x="822" y="365" text-anchor="middle" font-weight="700" fill="#0c447c">D</text>
      <path d="M844 360 H860" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
    </g>
  </g>
  <text x="560" y="478" text-anchor="middle" font-size="12.5" fill="#5f5e5a">Each button: pin → button → GND. A 100 kΩ pull-up from each button pin to 3V3 makes wake-up reliable.</text>
  <text x="560" y="498" text-anchor="middle" font-size="12.5" fill="#5f5e5a">LED: the built-in blue LED (GPIO 8). Optional panel LED: 3V3 → 1 kΩ → LED → GPIO 8.</text>
  <text x="450" y="526" text-anchor="middle" font-size="12" fill="#a32d2d">Remove the red power LED on the SuperMini before using batteries.</text>
</svg>
